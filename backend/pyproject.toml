[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instaloader-webui"
version = "0.1.0"
description = "Instaloader WebUI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<24",
    "cryptography>=48.0.1,<50",
    "fastapi>=0.115,<1",
    "instaloader==4.15.3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
instaloader-webui-worker = "instaloader_webui.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instaloader_webui"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "instaloader_webui/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=instaloader_webui --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["UP046"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disable_error_code = ["prop-decorator"]
