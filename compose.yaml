name: instaloader-webui

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${IW_HTTP_PORT:-8080}:8080"
    environment:
      IW_DATA_ROOT: /data
      IW_APP_SECRET_KEY: "${IW_APP_SECRET_KEY:?IW_APP_SECRET_KEY must be set}"
      IW_ADMIN_USERNAME: "${IW_ADMIN_USERNAME:?IW_ADMIN_USERNAME must be set}"
      IW_ADMIN_PASSWORD: "${IW_ADMIN_PASSWORD:-}"
      IW_SESSION_COOKIE_SECURE: "${IW_SESSION_COOKIE_SECURE:-false}"
    volumes:
      - "${IW_DATA_ROOT_HOST:-./data}:/data"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
